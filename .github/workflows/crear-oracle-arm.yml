name: Crear instancia Oracle ARM

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: crear-oracle-arm
  cancel-in-progress: false

jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
      AD: "ZcAP:SA-BOGOTA-1-AD-1"
      SUBNET: "ocid1.subnet.oc1.sa-bogota-1.aaaaaaaa34zyhmlq2wv4x5npbmvnyn26qi55ifdpifmmkjscbaa5bjqvvw4q"
      IMAGE: "ocid1.image.oc1.sa-bogota-1.aaaaaaaaapcabg47errjuz4xikytbhgl57una6jlwli7y2slj7p2yb4ezqda"
      NOMBRE: "homelab"
      OCPUS: "2"
      MEM: "12"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar OCI CLI
        run: pip install --quiet oci-cli

      - name: Configurar OCI y llave SSH
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          SSH_PUB: ${{ secrets.SSH_PUB }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" | tr -d '\r' > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=sa-bogota-1\nkey_file=%s\n' "$OCI_USER" "$OCI_FINGERPRINT" "$OCI_TENANCY" "$HOME/.oci/oci_api_key.pem" > ~/.oci/config
          printf '%s\n' "$SSH_PUB" | tr -d '\r' > ~/oracle-homelab.pub
          printf '{"ocpus":%s,"memoryInGBs":%s}' "$OCPUS" "$MEM" > ~/shape.json

      - name: Intentar crear la instancia
        id: crear
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
        run: |
          set +e
          EXISTE=$(oci compute instance list --compartment-id "$OCI_TENANCY" --display-name "$NOMBRE" --query 'data[?"lifecycle-state"!=`TERMINATED`] | length(@)' 2>/dev/null)
          if [ "${EXISTE:-0}" -gt 0 ] 2>/dev/null; then
            echo "Ya existe una instancia llamada $NOMBRE."
            echo "resultado=existe" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OUT=$(oci compute instance launch \
            --compartment-id "$OCI_TENANCY" \
            --availability-domain "$AD" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config "file://$HOME/shape.json" \
            --subnet-id "$SUBNET" \
            --image-id "$IMAGE" \
            --assign-public-ip true \
            --boot-volume-size-in-gbs 50 \
            --display-name "$NOMBRE" \
            --ssh-authorized-keys-file "$HOME/oracle-homelab.pub" 2>&1)
          echo "$OUT"

          if echo "$OUT" | grep -q '"lifecycle-state"'; then
            echo "resultado=creada" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -qiE 'Out of host capacity|Out of capacity|InternalError|TooManyRequests|429|500'; then
            echo "Sin capacidad todavia."
            echo "resultado=sin_capacidad" >> "$GITHUB_OUTPUT"
          else
            echo "resultado=error" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Desactivar el flujo y avisar
        if: steps.crear.outputs.resultado != 'sin_capacidad'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ steps.crear.outputs.resultado }}
        run: |
          gh workflow disable crear-oracle-arm.yml --repo "$GITHUB_REPOSITORY"
          if [ "$RESULTADO" = "creada" ]; then
            echo "::error::INSTANCIA CREADA. Revisa Computacion > Instancias en Oracle."
          else
            echo "::error::El flujo se detuvo. Resultado: $RESULTADO. Revisa el log del paso anterior."
          fi
          exit 1
